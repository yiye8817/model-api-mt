[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multillm-desktop-agent"
version = "0.17.0"
description = "Local command, browser and desktop agent for the MultiLLM Fusion text API"
requires-python = ">=3.10"
dependencies = ["json-repair>=0.30,<1"]

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]
desktop = ["PyAutoGUI>=0.9.54,<1", "Pillow>=10,<13", "pyperclip>=1.9,<2"]

[project.scripts]
fusion-agent = "fusion_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Built-in skills are read-only package resources.  Keep their Markdown,
# report template and static helper script available in wheel installations;
# editable source checkouts continue to use the top-level ``skills/`` tree.
fusion_agent = ["builtin_skills/**/SKILL.md", "builtin_skills/**/resources/*", "builtin_skills/**/scripts/*"]
